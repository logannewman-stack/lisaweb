<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" stroke="#C9A24B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- The Lisa Brunson mark.
       A lotus (from the signs on her walls and the crown flag) resting in the
       crescent moon of her wrist tattoo, with the moon's phases along it, her
       tattoo's eye beneath the flower, and its rays of dots above. -->
  <defs>
    <path id="petal" d="M60 16 C50 32 50 48 60 62 C70 48 70 32 60 16 Z"/>
  </defs>
  <!-- rays of dots -->
  <g fill="#C9A24B" stroke="none">
    <circle cx="60" cy="9" r="1.5"/><circle cx="60" cy="3.5" r="1"/>
    <circle cx="45" cy="12" r="1.3"/><circle cx="40.5" cy="7.5" r=".9"/>
    <circle cx="75" cy="12" r="1.3"/><circle cx="79.5" cy="7.5" r=".9"/>
  </g>
  <!-- lotus -->
  <g>
    <use href="#petal" transform="rotate(-72 60 62) translate(60 62) scale(.82) translate(-60 -62)"/>
    <use href="#petal" transform="rotate(72 60 62) translate(60 62) scale(.82) translate(-60 -62)"/>
    <use href="#petal" transform="rotate(-48 60 62) translate(60 62) scale(.92) translate(-60 -62)"/>
    <use href="#petal" transform="rotate(48 60 62) translate(60 62) scale(.92) translate(-60 -62)"/>
    <use href="#petal" transform="rotate(-24 60 62)"/>
    <use href="#petal" transform="rotate(24 60 62)"/>
    <use href="#petal"/>
  </g>
  <!-- the eye -->
  <g>
    <path d="M52 73 Q60 66.5 68 73 Q60 79.5 52 73 Z"/>
    <circle cx="60" cy="73" r="2.4"/>
    <circle cx="60" cy="73" r=".9" fill="#C9A24B" stroke="none"/>
  </g>
  <!-- the crescent moon, with its phases -->
  <g>
    <path d="M20 60 A40 40 0 0 0 100 60 A48 48 0 0 1 20 60 Z"/>
    <circle cx="60" cy="92.5" r="3" fill="#C9A24B" stroke="none"/>
    <path d="M80.9 81.9 a3 3 0 0 0 0 6 z" fill="#C9A24B" stroke="none"/><circle cx="80.9" cy="84.9" r="3"/>
    <path d="M39.1 87.9 a3 3 0 0 0 0 -6 z" fill="#C9A24B" stroke="none"/><circle cx="39.1" cy="84.9" r="3"/>
    <circle cx="89.5" cy="73.7" r="2.4"/>
    <circle cx="30.5" cy="73.7" r="2.4"/>
  </g>
</svg>
