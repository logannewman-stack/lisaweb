<style>
  /* A single quiet page while the full site waits on www.mystrandsofgrace.com.
     Colours and type are the site's own (css/theme.css). */
  :root {
    --ivory: #FFFDF8; --cream: #F8F3EA; --plum: #574467; --charcoal: #39343D;
    --gold: #C9A24E; --gold-light: #E6CC8A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: clamp(1.5rem, 5vw, 3rem) 1rem;
    background:
      radial-gradient(40rem 30rem at 6% 92%, rgb(242 183 210 / 0.28), transparent 70%),
      radial-gradient(36rem 28rem at 96% 6%, rgb(200 180 232 / 0.32), transparent 70%),
      radial-gradient(28rem 22rem at 92% 88%, rgb(246 198 168 / 0.22), transparent 70%),
      radial-gradient(26rem 20rem at 4% 8%, rgb(167 201 238 / 0.18), transparent 70%),
      var(--ivory);
    color: var(--charcoal);
    font: 400 1.125rem/1.6 "Nunito Sans", "Avenir Next", Avenir, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    text-align: center;
  }
  main { display: grid; justify-items: center; gap: 1.1rem; max-width: 40rem; }
  .emblem { width: min(36rem, 88vw); height: auto; max-height: min(27rem, 52svh); object-fit: contain; }
  h1 {
    margin: 0.25rem 0 0;
    font: 400 clamp(2.6rem, 2rem + 3vw, 4rem)/1.05 "Marcellus", Optima, Candara, "Palatino Linotype", Palatino, Georgia, serif;
    color: var(--plum);
    letter-spacing: 0.01em;
  }
  .rule { display: block; width: 9rem; height: 1rem; color: var(--gold); }
  p { margin: 0; max-width: 32ch; font-size: clamp(1.1rem, 1rem + 0.5vw, 1.3rem); }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.75rem 1.75rem; margin-top: 0.6rem; font-size: 1rem; }
  a {
    color: var(--plum);
    font-weight: 700;
    text-decoration: underline;
    text-decoration-color: var(--gold-light);
    text-decoration-thickness: 2px;
    text-underline-offset: 0.3em;
    padding: 0.6rem 0.2rem;
  }
  a:hover { text-decoration-color: var(--gold); }
  a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
  .small { font-size: 0.85rem; font-weight: 400; color: var(--charcoal); }
  @media (prefers-reduced-motion: no-preference) {
    main > * { animation: rise 0.8s cubic-bezier(.2,.7,.2,1) both; }
    main > :nth-child(2) { animation-delay: 0.15s; }
    main > :nth-child(3) { animation-delay: 0.25s; }
    main > :nth-child(4) { animation-delay: 0.35s; }
    main > :nth-child(5) { animation-delay: 0.45s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  }
</style>
</head>
